<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Research Hub · Academic Dashboard</title><style>@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #f5f7fb;
  --panel: #ffffff;
  --text: #172033;
  --muted: #7b8497;
  --line: #e7ebf2;
  --accent: #5367e8;
  --accent-soft: #eef0ff;
  --green: #16866a;
  --green-soft: #e7f7f0;
  --orange: #c47b18;
  --orange-soft: #fff4df;
  --red: #c44e58;
  --red-soft: #fff0f1;
  --shadow: 0 10px 30px rgba(33, 45, 80, .05);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Inter, "Noto Sans SC", sans-serif;
}
button, input, select { font: inherit; }
button { cursor: pointer; }

.app-shell { display: flex; min-height: 100vh; }
.sidebar {
  width: 255px;
  background: #10172a;
  color: #fff;
  padding: 28px 18px;
  display: flex;
  flex-direction: column;
}
.brand { display: flex; gap: 12px; align-items: center; padding: 0 10px 42px; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 13px;
  display: grid; place-items: center; background: #6676f1;
  font-size: 24px; font-weight: 800;
}
.brand-title { font-size: 14px; font-weight: 800; letter-spacing: 1px; }
.brand-subtitle { font-size: 11px; color: #9da8c7; margin-top: 4px; }
.nav { display: grid; gap: 8px; }
.nav-item {
  border: 0; background: transparent; color: #aeb8d1;
  text-align: left; padding: 14px 14px; border-radius: 11px;
  display: flex; gap: 12px; align-items: center; font-size: 14px;
}
.nav-item:hover, .nav-item.active { background: #273252; color: white; }
.sidebar-footer { margin-top: auto; padding: 20px 10px 0; color: #8995b5; font-size: 12px; line-height: 1.7; }
.small-label { font-size: 10px; letter-spacing: 1.5px; color: #68769b; margin-bottom: 8px; }
.data-status { color: #d9e0f5; }
.status-dot { display: inline-block; width: 7px; height: 7px; background: #48c69a; border-radius: 50%; margin-right: 7px; }

.main { flex: 1; min-width: 0; padding: 34px 42px 60px; }
.topbar { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 30px; }
.eyebrow { color: var(--accent); font-size: 11px; letter-spacing: 1.5px; font-weight: 800; }
h1 { margin: 8px 0 8px; font-size: 31px; letter-spacing: -.8px; }
.topbar p { margin: 0; color: var(--muted); font-size: 14px; }
.topbar-date { color: var(--muted); font-size: 13px; padding-top: 8px; white-space: nowrap; }

.stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; margin-bottom: 26px; }
.stat-card, .panel, .paper-card { background: var(--panel); border: 1px solid var(--line); border-radius: 17px; box-shadow: var(--shadow); }
.stat-card { padding: 22px; }
.stat-label { color: var(--muted); font-size: 13px; }
.stat-number { font-size: 34px; font-weight: 800; margin: 10px 0 5px; letter-spacing: -1px; }
.stat-foot { color: var(--muted); font-size: 12px; }

.section-head { display: flex; justify-content: space-between; align-items: center; margin: 28px 0 14px; gap: 12px; }
.section-head h2 { font-size: 18px; margin: 0; }
.section-head p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

.panel { padding: 22px; }
.progress-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 10px; }
.progress-track { height: 10px; background: #edf0f6; border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 99px; }
.dashboard-grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 20px; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.search, .select {
  border: 1px solid var(--line); background: white; border-radius: 10px;
  padding: 11px 13px; color: var(--text); outline: none;
}
.search { flex: 1; min-width: 220px; }
.search:focus, .select:focus { border-color: var(--accent); }

.cards-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.paper-card { padding: 22px; display: flex; flex-direction: column; gap: 15px; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.paper-id { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 1px; }
.paper-title { font-size: 17px; line-height: 1.45; font-weight: 700; margin: 5px 0 0; }
.meta { display: flex; flex-wrap: wrap; gap: 7px; }
.tag, .badge { display: inline-flex; align-items: center; border-radius: 7px; padding: 5px 8px; font-size: 11px; font-weight: 700; }
.tag { background: #f1f3f8; color: #667087; }
.badge.green { background: var(--green-soft); color: var(--green); }
.badge.orange { background: var(--orange-soft); color: var(--orange); }
.badge.red { background: var(--red-soft); color: var(--red); }
.badge.blue { background: var(--accent-soft); color: var(--accent); }
.muted { color: var(--muted); font-size: 12px; }
.card-line { display: flex; justify-content: space-between; gap: 15px; font-size: 13px; }
.card-line strong { font-weight: 600; text-align: right; }
.next-action { background: #fafbfe; border: 1px solid #edf0f6; border-radius: 10px; padding: 12px; font-size: 12px; line-height: 1.6; }
.next-action b { display: block; font-size: 10px; color: var(--accent); letter-spacing: .8px; margin-bottom: 4px; }
.card-actions { display: flex; gap: 8px; margin-top: auto; }
.btn {
  border: 1px solid var(--line); background: white; color: var(--text);
  padding: 9px 12px; border-radius: 9px; font-size: 12px; font-weight: 700;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: white; border-color: var(--accent); }

.stage-list { display: grid; gap: 8px; }
.stage { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding: 8px 10px; border-radius: 8px; background: #f8f9fc; }
.stage.done { background: #eff9f5; color: var(--green); }
.timeline { display: grid; gap: 10px; }
.timeline-item { display: grid; grid-template-columns: 92px 1fr; gap: 12px; font-size: 12px; }
.timeline-date { color: var(--muted); }
.timeline-content { border-left: 2px solid #dfe4f3; padding: 0 0 12px 14px; }
.timeline-content strong { display: block; margin-bottom: 3px; }

.detail-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
.abstract { color: #586277; font-size: 13px; line-height: 1.9; }
.citation-box { text-align: center; padding: 20px; background: #f7f8ff; border-radius: 13px; }
.citation-number { font-size: 44px; font-weight: 800; color: var(--accent); }
.citation-label { color: var(--muted); font-size: 12px; }
.keywords { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }

.empty { padding: 45px 20px; text-align: center; color: var(--muted); background: white; border: 1px dashed var(--line); border-radius: 14px; }

@media (max-width: 1050px) {
  .sidebar { width: 210px; }
  .main { padding: 28px; }
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .dashboard-grid, .detail-grid { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .app-shell { display: block; }
  .sidebar { width: 100%; padding: 16px; }
  .brand { padding-bottom: 16px; }
  .nav { display: flex; overflow-x: auto; }
  .nav-item { white-space: nowrap; }
  .sidebar-footer { display: none; }
  .main { padding: 24px 16px 40px; }
  .topbar { display: block; }
  .topbar-date { margin-top: 12px; }
  .cards-grid { grid-template-columns: 1fr; }
}
.helper-note { margin: 0 0 18px; padding: 10px 12px; border: 1px solid var(--border); background: #fafafa; color: var(--muted); font-size: 12px; line-height: 1.6; border-radius: 8px; }
.citation-live { border-left: 3px solid #6b7f99; }
.citation-static { border-left: 3px solid #aaa; }
.btn:disabled { opacity: .55; cursor: wait; }

/* ===== V1.3 可编辑阶段树 ===== */
.stage-tree { display: grid; gap: 6px; }
.stage-node { display: grid; gap: 6px; }
.stage-row { display: flex; align-items: center; gap: 9px; padding: 7px 9px; border-radius: 8px; background: var(--hover-bg); font-size: 12px; }
.stage-row.done { background: var(--green-soft); }
.stage-toggle { width: 19px; height: 19px; border-radius: 50%; border: 2px solid #c4ccdd; background: transparent; color: transparent; display: grid; place-items: center; font-size: 11px; font-weight: 800; flex: none; padding: 0; line-height: 1; transition: all .15s ease; }
.stage-toggle:hover { border-color: var(--green); }
.stage-row.done .stage-toggle { border-color: var(--green); background: var(--green); color: #fff; }
.stage-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stage-row.done .stage-name { color: var(--green); }
.stage-state { color: var(--muted); font-size: 11px; white-space: nowrap; }
.stage-row.done .stage-state { color: var(--green); }
.stage-tools { display: flex; gap: 4px; flex: none; }
.stage-tool { border: 1px solid var(--line); background: var(--field-bg); color: var(--muted); border-radius: 6px; width: 22px; height: 22px; font-size: 11px; display: grid; place-items: center; padding: 0; line-height: 1; }
.stage-tool:hover { border-color: var(--accent); color: var(--accent); }
.stage-children { margin-left: 16px; padding-left: 12px; border-left: 2px solid var(--line); display: grid; gap: 6px; }
.stage-add-btn { width: 100%; border-style: dashed; color: var(--muted); margin-top: 2px; }
.stage-add-btn:hover { color: var(--accent); border-color: var(--accent); }

/* ===== V1.4 阶段拖拽排序 ===== */
.stage-row[draggable="true"] { cursor: grab; }
.stage-row.dragging { opacity: .45; }
.stage-row.drag-over-top { box-shadow: inset 0 2px 0 var(--accent); }
.stage-row.drag-over-bottom { box-shadow: inset 0 -2px 0 var(--accent); }
.drag-handle { color: #b6bdd0; flex: none; user-select: none; font-size: 13px; }
.stage-row.done .drag-handle { color: #9ec9bb; }

/* ===== V1.4 双击行内编辑 ===== */
.editable { cursor: text; border-bottom: 1px dashed transparent; border-radius: 3px; padding: 0 2px; }
.editable:hover { border-bottom-color: var(--accent); }
.edit-input { width: 100%; min-width: 90px; border: 1px solid var(--accent); border-radius: 6px; padding: 3px 7px; font-size: inherit; font-weight: inherit; background: var(--field-bg); color: var(--text); outline: none; box-sizing: border-box; }

/* ===== V1.4 文件夹路径行 ===== */
.file-path-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.file-path-row > .muted { flex: none; line-height: 1.6; }
.path-text { flex: 1; min-width: 0; word-break: break-all; line-height: 1.6; }
.file-path-row .btn { flex: none; padding: 5px 10px; line-height: 1.4; }

/* ===== V1.6 卡片拖拽 / 删除 / 新增 ===== */
.paper-card { position: relative; }
.paper-card[draggable="true"] { cursor: grab; }
.paper-card.dragging { opacity: .45; }
.paper-card.drag-over-top::before, .paper-card.drag-over-bottom::after { content: ""; position: absolute; left: 8px; right: 8px; height: 3px; background: var(--accent); border-radius: 2px; z-index: 5; }
.paper-card.drag-over-top::before { top: -2px; }
.paper-card.drag-over-bottom::after { bottom: -2px; }

/* ===== V1.6 关键词编辑器（在研论文） ===== */
.kw-editor { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; }
.kw-editor > .muted { flex: none; padding-top: 4px; }
.kw-list { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; }
.kw-tag { position: relative; }
.kw-del { display: none; position: absolute; top: -7px; right: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--red); color: #fff; font-size: 9px; line-height: 13px; text-align: center; padding: 0; border: 0; cursor: pointer; }
.kw-tag:hover .kw-del { display: block; }
.kw-add { flex: none; border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 7px; width: 22px; height: 22px; padding: 0; line-height: 1; cursor: pointer; }
.kw-add:hover { color: var(--accent); border-color: var(--accent); }

/* ===== V1.6 标题行内编辑 / 投稿历史状态下拉 ===== */
.editable-title { display: block; font-size: 17px; font-weight: 700; line-height: 1.45; }
.hist-status { padding: 3px 6px; font-size: 11px; min-width: 80px; margin-top: 4px; }

/* ===== V1.7 优先级下拉 / 流转按钮 / 投稿历史增删 ===== */
.priority-select { padding: 4px 6px; font-size: 11px; font-weight: 700; min-width: 88px; height: 25px; cursor: pointer; }
.pri-High { background: var(--red-soft); color: var(--red); border-color: transparent; }
.pri-Medium { background: var(--orange-soft); color: var(--orange); border-color: transparent; }
.pri-Average { background: var(--green-soft); color: var(--green); border-color: transparent; }
.flow-btn { width: 100%; border-style: dashed; color: var(--accent); margin-top: 2px; }
.flow-btn:hover { background: var(--accent-soft); }
.hist-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.timeline-content .stage-tool { margin-top: 4px; margin-left: 4px; }

/* ===== V1.8 标题区布局 / 作者关键词胶囊编辑器 ===== */
.card-top > div:first-child { flex: 1; min-width: 0; }
.card-top > div:last-child { flex: none; }
.paper-title { word-break: break-word; }
.chip-editor { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; }
.chip-editor > .chip-label { flex: none; padding-top: 4px; color: var(--muted); }
.chip-list { flex: 1; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { position: relative; background: var(--green-soft); color: var(--green); cursor: grab; }
.chip.dragging { opacity: .4; }
.chip.drag-over-left { box-shadow: inset 2px 0 0 var(--accent); }
.chip.drag-over-right { box-shadow: inset -2px 0 0 var(--accent); }
.chip-del { display: none; position: absolute; top: -7px; right: -7px; width: 14px; height: 14px; border-radius: 50%; background: var(--red); color: #fff; font-size: 9px; line-height: 13px; text-align: center; padding: 0; border: 0; cursor: pointer; }
.chip:hover .chip-del { display: block; }
.editable-abstract { display: block; font-size: 13px; line-height: 1.9; font-weight: 400; color: #586277; }

/* ===== V1.9 Crossref 邮箱输入 ===== */
.email-row { display: flex; align-items: center; gap: 10px; margin: -6px 0 14px; font-size: 12px; flex-wrap: wrap; }
.email-row > .muted:first-child { flex: none; }
.email-input { flex: 1; min-width: 240px; max-width: 460px; border: 1px solid var(--line); background: var(--field-bg); color: var(--text); border-radius: 9px; padding: 8px 11px; outline: none; font-size: 12px; }
.email-input:focus { border-color: var(--accent); }
.email-status { font-size: 11px; }

/* ===== V2.1 引用次数操作 ===== */
.citation-actions { margin-top: 10px; }
.citation-actions .btn { padding: 5px 11px; font-size: 11px; }

.published-toolbar { align-items: center; }
.view-switch { display: inline-flex; padding: 3px; border: 1px solid var(--line); background: #f6f7fa; border-radius: 10px; }
.view-btn { border: 0; background: transparent; color: var(--muted); padding: 8px 12px; border-radius: 7px; font-size: 12px; font-weight: 700; cursor: pointer; }
.view-btn.active { background: white; color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.reference-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.reference-column { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.reference-column-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.reference-column-head h2 { margin: 0; font-size: 17px; }
.reference-column-head p { margin: 5px 0 0; color: var(--muted); font-size: 12px; }
.reference-sort { min-width: 150px; }
.reference-list { margin: 0; padding: 12px 22px 18px 48px; }
.reference-list li { padding: 12px 0 12px 4px; border-bottom: 1px solid #edf0f4; color: var(--text); font-size: 13px; line-height: 1.8; }
.reference-list li:last-child { border-bottom: 0; }
.reference-text { display: block; }
.reference-meta { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; letter-spacing: .3px; }
.reference-empty { list-style: none; color: var(--muted); }
@media (max-width: 900px) { .reference-layout { grid-template-columns: 1fr; } }

.topbar-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-width:420px}.status-bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:flex-end}.status-item{display:flex;align-items:baseline;gap:5px;white-space:nowrap}.status-item strong{font-size:16px}.status-item span{font-size:11px;color:var(--muted)}.clock-line{font-size:12px;color:var(--muted);white-space:nowrap}.theme-wrap{position:relative}.theme-btn{border:1px solid var(--line);background:var(--field-bg);color:var(--text);border-radius:9px;padding:8px 11px;font-size:12px;font-weight:700}.theme-btn:hover{border-color:var(--accent);color:var(--accent)}.theme-menu{display:none;position:absolute;right:0;top:42px;z-index:50;width:185px;padding:7px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 35px rgba(0,0,0,.12)}.theme-menu.open{display:block}.theme-option{width:100%;border:0;background:transparent;padding:9px 10px;border-radius:8px;display:flex;align-items:center;gap:9px;color:var(--text);text-align:left;font-size:12px}.theme-option:hover,.theme-option.active{background:var(--accent-soft);color:var(--accent)}.theme-dot{width:9px;height:9px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}.reference-copy-row{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin:-4px 0 16px}.copy-status{margin-right:auto;color:var(--muted);font-size:11px}@media(max-width:900px){.topbar-right{min-width:0;align-items:flex-start}.status-bar{justify-content:flex-start}}

/* V1.2 Theme Engine — visual overrides */
:root {
  --sidebar-bg: #10172a;
  --sidebar-text: #aeb8d1;
  --sidebar-active: #273252;
  --field-bg: #ffffff;
  --hover-bg: #f8f9fc;
  --progress-bg: #e9edf5;
  --card-border: #e7ebf2;
}
body.theme-graphite { --bg:#eef0f2; --panel:#ffffff; --text:#20242a; --muted:#69717c; --line:#d9dde3; --accent:#4b5563; --accent-soft:#eef0f2; --sidebar-bg:#25282d; --sidebar-text:#b9bec7; --sidebar-active:#3b4048; --field-bg:#fff; --hover-bg:#f4f5f6; --progress-bg:#e1e4e8; --card-border:#d9dde3; }
body.theme-forest { --bg:#f0f5f1; --panel:#ffffff; --text:#203028; --muted:#718078; --line:#dce7df; --accent:#39755a; --accent-soft:#e8f2ec; --sidebar-bg:#173328; --sidebar-text:#b6cbbf; --sidebar-active:#28513f; --field-bg:#fff; --hover-bg:#f3f8f5; --progress-bg:#dfeae3; --card-border:#dce7df; }
body.theme-burgundy { --bg:#f7f2f3; --panel:#ffffff; --text:#33272a; --muted:#88767b; --line:#eadfe2; --accent:#874957; --accent-soft:#f6e9ec; --sidebar-bg:#351d25; --sidebar-text:#cbb6bc; --sidebar-active:#59313d; --field-bg:#fff; --hover-bg:#faf5f6; --progress-bg:#eadde1; --card-border:#eadfe2; }
body.theme-indigo { --bg:#f2f3f8; --panel:#ffffff; --text:#25283a; --muted:#74798d; --line:#dfe2ee; --accent:#5964a8; --accent-soft:#eceef9; --sidebar-bg:#20243f; --sidebar-text:#b8bdd7; --sidebar-active:#343b63; --field-bg:#fff; --hover-bg:#f5f6fb; --progress-bg:#e1e4f0; --card-border:#dfe2ee; }
body.theme-paper { --bg:#f4f0e8; --panel:#fffdf8; --text:#302d27; --muted:#817b6f; --line:#e5dfd3; --accent:#8a6b3f; --accent-soft:#f3ecdf; --sidebar-bg:#3b352d; --sidebar-text:#d0c7b8; --sidebar-active:#5a5043; --field-bg:#fffdf8; --hover-bg:#faf6ee; --progress-bg:#e6dfd2; --card-border:#e5dfd3; }
body, .main, .panel, .paper-card, .stat-card, .submission-card, .reference-column, .next-action, input, select, .btn, .theme-btn { transition: background-color .22s ease, color .22s ease, border-color .22s ease, box-shadow .22s ease; }
body { background:var(--bg); color:var(--text); }
.sidebar { background:var(--sidebar-bg); }
.brand-mark { background:var(--accent); }
.nav-item { color:var(--sidebar-text); }
.nav-item:hover, .nav-item.active { background:var(--sidebar-active); color:#fff; }
.brand-subtitle { color:var(--sidebar-text); opacity:.78; }
.panel, .paper-card, .stat-card, .submission-card, .reference-column { border-color:var(--card-border); }
.panel, .paper-card, .stat-card, .submission-card, .reference-column { background:var(--panel); }
.btn, .theme-btn, input, select { background:var(--field-bg); color:var(--text); border-color:var(--line); }
.btn.primary { background:var(--accent); border-color:var(--accent); }
.tag { background:var(--accent-soft); color:var(--accent); }
.stage { background:var(--hover-bg); }

// ================================================================
// 【Crossref 引用次数设置】
// 1. 在“已发表论文”页面的邮箱输入框中填写联系邮箱（保存在浏览器本地，
//    不写死在 HTML 里，公开分享文件也不会泄露邮箱）；
// 2. 英文论文 language="en" 且填写真实 DOI 后，页面会自动查询 Crossref；
// 3. 中文论文 language="zh" 时不会请求 Crossref，只显示“非实时数据”；
// 4. 查询结果会缓存在浏览器本地，避免重复请求。
// ================================================================
const CROSSREF_EMAIL_KEY = "research-hub-crossref-email";
const CROSSREF_DELAY_MS = 350; // 礼貌访问：请求之间留出间隔
const CROSSREF_CACHE_KEY = "research-hub-crossref-citations-v1";

function getCrossrefEmail() {
  try { return localStorage.getItem(CROSSREF_EMAIL_KEY) || ""; } catch (e) { return ""; }
}

function setCrossrefEmail(v) {
  try { localStorage.setItem(CROSSREF_EMAIL_KEY, (v || "").trim()); } catch (e) {}
  const st = document.getElementById("emailStatus");
  if (st) st.textContent = (v || "").trim() ? "✓ 已保存" : "未设置";
}

function isEnglishPaper(p) {
  // 以期刊名称识别中英文：期刊名含中文 → 中文文章，否则 → 英文文章；
  // 期刊名为空时回退到 language 字段。
  const journal = String(getPaperField(p, "journal") || "").trim();
  if (!journal) return String(p.language || "").toLowerCase() === "en";
  return !/[一-鿿]/.test(journal);
}

function normalizeDoi(doi) {
  if (!doi) return "";
  return String(doi).trim()
    .replace(/^https?:\/\/(doi\.org\/)?/i, "")
    .replace(/^doi:\s*/i, "");
}

function getCitationCache() {
  try { return JSON.parse(localStorage.getItem(CROSSREF_CACHE_KEY) || "{}"); }
  catch (e) { return {}; }
}

function setCitationCache(cache) {
  try { localStorage.setItem(CROSSREF_CACHE_KEY, JSON.stringify(cache)); }
  catch (e) {}
}

async function fetchCrossrefCitation(p, force = false) {
  if (!isEnglishPaper(p)) return { status: "non-realtime", citations: p.citations ?? null };
  const doi = normalizeDoi(p.doi);
  if (!doi || doi.includes("xxxx")) return { status: "missing-doi", citations: null };
  const cache = getCitationCache();
  if (!force && cache[doi]) return { status: "cached", citations: cache[doi].citations, updatedAt: cache[doi].updatedAt };

  const email = getCrossrefEmail();
  const url = `https://api.crossref.org/v1/works/${encodeURIComponent(doi)}${email ? "?mailto=" + encodeURIComponent(email) : ""}`;
  try {
    const response = await fetch(url, {
      headers: { "Accept": "application/json" }
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const json = await response.json();
    const count = json?.message?.["is-referenced-by-count"];
    if (typeof count !== "number") throw new Error("Crossref 未返回引用次数");
    cache[doi] = { citations: count, updatedAt: new Date().toISOString() };
    setCitationCache(cache);
    p.citations = count;
    p.citationSource = "Crossref";
    p.citationUpdatedAt = cache[doi].updatedAt;
    return { status: "live", citations: count, updatedAt: cache[doi].updatedAt };
  } catch (error) {
    console.warn("Crossref citation lookup failed:", p.title, error);
    return { status: "error", citations: p.citations ?? null, error: error.message };
  }
}

async function updatePublishedCitations(force = false) {
  if (!DATA?.published?.length) return;
  const button = document.getElementById("refreshCitations");
  if (button) { button.disabled = true; button.textContent = "正在更新…"; }
  for (const p of DATA.published) {
    if (!isEnglishPaper(p)) continue;
    await fetchCrossrefCitation(p, force);
    await new Promise(resolve => setTimeout(resolve, CROSSREF_DELAY_MS));
  }
  if (currentPage === "published") {
    const root = document.getElementById("page-content");
    root.innerHTML = renderPublished();
    bindFilters();
  }
  if (button) { button.disabled = false; button.textContent = "更新 Crossref 引用"; }
}

        <div class="timeline">
          ${recent.map(p => `<div class="timeline-item">

            <div class="timeline-content"><strong>${escapeHtml(p.title)}</strong><span class="muted">${p.kind} · ${escapeHtml(p.nextAction || "暂无下一步任务")}</span></div>

function sortPublishedReferences(list, mode) {
  return [...list].sort((a, b) => {
    const yearA = Number(a.year) || 0;
    const yearB = Number(b.year) || 0;
    const soloA = (a.authors || []).length === 1;
    const soloB = (b.authors || []).length === 1;
    const authorA = String((a.authors || [""])[0] || "").toLowerCase();
    const authorB = String((b.authors || [""])[0] || "").toLowerCase();
    if (mode === "year-asc") return yearA - yearB || authorA.localeCompare(authorB, "zh");
    if (mode === "solo-first") return Number(!soloA) - Number(!soloB) || yearB - yearA || authorA.localeCompare(authorB, "zh");
    if (mode === "coauthor-first") return Number(soloA) - Number(soloB) || yearB - yearA || authorA.localeCompare(authorB, "zh");
    if (mode === "author") return authorA.localeCompare(authorB, "zh") || yearB - yearA;
    return yearB - yearA || authorA.localeCompare(authorB, "zh");
  });
}

function formatChineseAuthors(authors) {
  return (authors || []).join("，");
}

function formatEnglishAuthor(name) {
  const raw = String(name || "").trim();
  if (!raw) return "";
  // 若已经采用“Surname Initials”形式，则直接保留。
  if (/^[^\s,]+\s+[A-Z](?:\.?\s*[A-Z]\.?)*$/.test(raw)) return raw;
  const parts = raw.replace(/\./g, "").split(/\s+/).filter(Boolean);
  if (parts.length === 1) return parts[0];
  const surname = parts[parts.length - 1];
  const initials = parts.slice(0, -1).map(x => x[0].toUpperCase()).join(" ");
  return `${surname} ${initials}`;
}

function formatEnglishAuthors(authors) {
  return (authors || []).map(formatEnglishAuthor).join(", ");
}

function buildGb7714Reference(p) {
  const type = p.referenceType || "J";
  const isEn = isEnglishPaper(p);
  const authors = isEn ? formatEnglishAuthors(getPaperField(p, "authors") || []) : formatChineseAuthors(getPaperField(p, "authors") || []);
  const title = getPaperField(p, "title") || "未填写题名";
  const journal = getPaperField(p, "journal") || "未填写期刊";
  const year = getPaperField(p, "year") || "未填写年份";
  const volume = getPaperField(p, "volume") ? String(getPaperField(p, "volume")) : "";
  const issue = getPaperField(p, "issue") ? String(getPaperField(p, "issue")) : "";
  const pages = getPaperField(p, "pages") ? String(getPaperField(p, "pages")) : "";
  let yearVolumeIssue = String(year);
  if (volume && issue) yearVolumeIssue += `, ${volume}(${issue})`;
  else if (volume) yearVolumeIssue += `, ${volume}`;
  else if (issue) yearVolumeIssue += ` (${issue})`;
  let ref = `${authors}. ${title}[${type}]. ${journal}, ${yearVolumeIssue}`;
  if (pages) ref += `: ${pages}`;
  ref += ".";
  const doi = getPaperField(p, "doi") || "";
  if (doi && isEn && !String(doi).includes("xxxx")) ref += ` DOI:${normalizeDoi(doi)}.`;
  return ref;
}

  if (!isEnglishPaper(p)) {
    return `<div class="citation-box citation-static">

      <div class="citation-label">引用次数 · 双击手工录入（中文期刊不支持 Crossref）</div>
    </div>`;
  }
  const doi = normalizeDoi(getPaperField(p, "doi") || "");
  const hasRealDoi = doi && !doi.includes("xxxx");
  const cache = getCitationCache();
  const cached = hasRealDoi ? cache[doi] : null;
  const display = cached ? cached.citations : count;
  const label = cached ? `已根据 DOI 自动获取（${String(cached.updatedAt || "").slice(0, 10)}）` : "双击手工修改，或从 Crossref 自动获取";
  return `<div class="citation-box citation-live">
    <div class="citation-number">${citationEditable(p, display)}</div>
    <div class="citation-label">引用次数 · ${label}</div>
    <div class="citation-actions"><button class="btn" onclick="fetchCitationFor('${p._key}')" title="根据 DOI 从 Crossref 自动获取引用次数">从 Crossref 获取</button></div>

// 单篇从 Crossref 获取：提醒用户需要真实 DOI 与联系邮箱，获取成功将覆盖手工值
async function fetchCitationFor(key) {
  const p = findPaperByKey(key);
  if (!p) return;
  if (!isEnglishPaper(p)) { alert("中文期刊文章不支持 Crossref 查询，请双击引用次数手工录入。"); return; }
  const doi = normalizeDoi(getPaperField(p, "doi") || "");
  if (!doi || doi.includes("xxxx")) { alert("请先双击“DOI”填写该论文的真实 DOI，再获取 Crossref 引用。"); return; }
  if (!getCrossrefEmail()) { alert("请先在页面上方填写 Crossref 联系邮箱（用于礼貌获取数据），再试一次。"); return; }
  if (!confirm("将根据 DOI 从 Crossref 获取最新引用次数，并覆盖当前手工修改的值。是否继续？")) return;
  const res = await fetchCrossrefCitation(p, true);
  if (res && (res.status === "live" || res.status === "cached")) {
    render();
    updateStatusBar();
    alert(`已更新引用次数：${res.citations} 次。`);
  } else {
    alert("获取失败：请检查网络连接或 DOI 是否正确。");
  }
}

// ================================================================
// 【V1.3 可编辑阶段树】
// 1. 点击空心圆 ○ 标记完成（再次点击取消），完成后变绿底白勾 ✓；
// 2. ＋ 添加子阶段、✎ 重命名、✕ 删除；一级阶段用底部按钮添加；
// 3. 最多支持三级阶段；勾选父级会级联勾选/取消所有子级；
// 4. 所有修改自动保存在浏览器 localStorage，刷新后仍然保留。
// ================================================================
const STAGE_STORE_KEY = "research-hub-stages-v1";

// 稳定内部键：卡片增删/拖拽重编号后，_key 保持不变，localStorage 数据不丢失
function pkey(p) { return p._key || p.id; }
function findPaperByKey(key) {
  return [...(DATA.research || []), ...(DATA.submitted || []), ...(DATA.published || [])]
    .find(x => x._key === key || x.id === key);
}
const DEFAULT_STAGES = ["引言", "文献综述/理论假设", "研究设计", "实证分析", "结论与启示"];
const MAX_STAGE_LEVEL = 3;

function migrateStages(raw) {
  if (!Array.isArray(raw)) return [];
  return raw.map(s => {
    if (typeof s === "string") return { name: s, done: false, children: [] };
    return { name: s.name || "未命名阶段", done: !!s.done, children: migrateStages(s.children) };
  });
}

function getStageStore() {
  try { return JSON.parse(localStorage.getItem(STAGE_STORE_KEY) || "{}"); } catch (e) { return {}; }
}

function persistPaperStages(p, stages) {
  const store = getStageStore();
  store[pkey(p)] = stages;
  try { localStorage.setItem(STAGE_STORE_KEY, JSON.stringify(store)); } catch (e) {}
  p.stages = stages;
  touchPaper(p);
}

function getPaperStages(p) {
  const store = getStageStore();
  if (Array.isArray(store[pkey(p)])) return store[pkey(p)];
  const migrated = migrateStages(p.stages);
  return migrated.length ? migrated : DEFAULT_STAGES.map(name => ({ name, done: false, children: [] }));
}

function countStageLeaves(stages) {
  let total = 0, done = 0;
  (function walk(nodes) {
    nodes.forEach(n => {
      if (n.children && n.children.length) walk(n.children);
      else { total++; if (n.done) done++; }
    });
  })(stages);
  return { total, done };
}

function computeProgress(stages) {
  const { total, done } = countStageLeaves(stages);
  return total ? Math.round(done / total * 100) : 0;
}

function renderStageBlock(p) {
  const stages = getPaperStages(p);
  const progress = computeProgress(stages);
  return `<div>
    <div class="progress-row"><span class="muted">研究进度（按阶段完成情况自动计算）</span><b>${progress}%</b></div>
    <div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div>
    <div style="height:12px"></div>
    <div class="stage-tree">${stages.map((s, i) => renderStageNode(p, s, [i], 1)).join("")}
      <button class="btn stage-add-btn" onclick="addStage('${p._key}', [])">＋ 添加一级阶段</button>
    </div>
  </div>`;
}

function renderStageNode(p, node, path, level) {
  const kids = node.children || [];
  return `<div class="stage-node">
    <div class="stage-row ${node.done ? "done" : ""}" draggable="true" title="拖动 ≣ 可在同级阶段间调整顺序"
      ondragstart="stageDragStart(event, '${p._key}', ${JSON.stringify(path)})"
      ondragover="stageDragOver(event, '${p._key}', ${JSON.stringify(path)})"
      ondragleave="stageDragLeave(event)"
      ondrop="stageDrop(event, '${p._key}', ${JSON.stringify(path)})"
      ondragend="stageDragEnd(event)">
      <span class="drag-handle" title="拖动调整顺序（仅限同级）">≣</span>
      <button class="stage-toggle" title="${node.done ? "点击标记为未完成" : "点击标记为已完成"}" onclick="toggleStage('${p._key}', ${JSON.stringify(path)})">${node.done ? "✓" : ""}</button>
      <span class="stage-name">${escapeHtml(node.name)}</span>
      <span class="stage-state">${node.done ? "已完成" : "待完成"}</span>
      <span class="stage-tools">
        ${level < MAX_STAGE_LEVEL ? `<button class="stage-tool" title="添加子阶段（当前为第 ${level} 级）" onclick="addStage('${p._key}', ${JSON.stringify(path)})">＋</button>` : ""}
        <button class="stage-tool" title="重命名阶段" onclick="renameStage('${p._key}', ${JSON.stringify(path)})">✎</button>
        <button class="stage-tool" title="删除该阶段（含全部子阶段）" onclick="deleteStage('${p._key}', ${JSON.stringify(path)})">✕</button>
      </span>
    </div>
    ${kids.length ? `<div class="stage-children">${kids.map((c, j) => renderStageNode(p, c, path.concat(j), level + 1)).join("")}</div>` : ""}
  </div>`;
}

function findStageNode(stages, path) {
  let node = { children: stages };
  for (const i of path) node = node.children[i];
  return node;
}

function clonePaperStages(p) {
  return JSON.parse(JSON.stringify(getPaperStages(p)));
}

function refreshAfterStageEdit() {
  render();
  updateStatusBar();
}

function toggleStage(id, path) {
  const p = findPaperByKey(id);
  if (!p) return;
  const stages = clonePaperStages(p);
  const node = findStageNode(stages, path);
  node.done = !node.done;
  (function cascade(n) { (n.children || []).forEach(c => { c.done = node.done; cascade(c); }); })(node);
  persistPaperStages(p, stages);
  refreshAfterStageEdit();
}

function addStage(id, path) {
  const p = findPaperByKey(id);
  if (!p) return;
  if (path.length >= MAX_STAGE_LEVEL) { alert("最多只能添加到三级阶段。"); return; }
  const name = prompt(`请输入新阶段名称（将添加为第 ${path.length + 1} 级阶段）：`);
  if (!name || !name.trim()) return;
  const stages = clonePaperStages(p);
  const parent = path.length ? findStageNode(stages, path) : { children: stages };
  parent.children = parent.children || [];
  parent.children.push({ name: name.trim(), done: false, children: [] });
  persistPaperStages(p, stages);
  refreshAfterStageEdit();
}

function renameStage(id, path) {
  const p = findPaperByKey(id);
  if (!p) return;
  const stages = clonePaperStages(p);
  const node = findStageNode(stages, path);
  const name = prompt("修改阶段名称：", node.name);
  if (!name || !name.trim()) return;
  node.name = name.trim();
  persistPaperStages(p, stages);
  refreshAfterStageEdit();
}

function deleteStage(id, path) {
  const p = findPaperByKey(id);
  if (!p) return;
  const stages = clonePaperStages(p);
  const node = findStageNode(stages, path);
  const childCount = (function count(n) { return (n.children || []).reduce((s, c) => s + 1 + count(c), 0); })(node);
  if (!confirm(`确定删除阶段“${node.name}”吗？${childCount ? `其下 ${childCount} 个子阶段将一并删除。` : ""}`)) return;
  const parent = findStageNode(stages, path.slice(0, -1));
  parent.children.splice(path[path.length - 1], 1);
  persistPaperStages(p, stages);
  refreshAfterStageEdit();
}

// ================================================================
// 【V1.4 阶段拖拽排序】
// 1. 一级阶段可在所有一级阶段之间自由拖动排序；
// 2. 二级阶段只能在其所属的一级阶段内部拖动排序，三级同理；
// 3. 拖到非法位置（跨父级/跨层级）时会提示且不落位。
// ================================================================
let stageDrag = null; // { paperId, path }

function stageDragStart(ev, id, path) {
  stageDrag = { paperId: id, path: path };
  ev.dataTransfer.effectAllowed = "move";
  try { ev.dataTransfer.setData("text/plain", ""); } catch (e) {}
  ev.currentTarget.classList.add("dragging");
}

function stageDragOver(ev, id, path) {
  if (!stageDrag || stageDrag.paperId !== id) return;
  ev.preventDefault();
  const row = ev.currentTarget;
  const rect = row.getBoundingClientRect();
  const before = ev.clientY < rect.top + rect.height / 2;
  row.classList.toggle("drag-over-top", before);
  row.classList.toggle("drag-over-bottom", !before);
}

function stageDragLeave(ev) {
  ev.currentTarget.classList.remove("drag-over-top", "drag-over-bottom");
}

function stageDrop(ev, id, path) {
  ev.preventDefault();
  ev.currentTarget.classList.remove("drag-over-top", "drag-over-bottom");
  if (!stageDrag || stageDrag.paperId !== id) return;
  const rect = ev.currentTarget.getBoundingClientRect();
  const before = ev.clientY < rect.top + rect.height / 2;
  moveStage(id, stageDrag.path, path, before);
  stageDrag = null;
}

function stageDragEnd() {
  stageDrag = null;
  document.querySelectorAll(".stage-row.dragging, .stage-row.drag-over-top, .stage-row.drag-over-bottom")
    .forEach(el => el.classList.remove("dragging", "drag-over-top", "drag-over-bottom"));
}

function moveStage(id, fromPath, toPath, insertBefore) {
  const p = findPaperByKey(id);
  if (!p) return;
  if (fromPath.length !== toPath.length) {
    alert("只能将阶段拖动到同级位置：一级阶段可自由排序，二级/三级阶段只能在其父阶段内部移动。");
    return;
  }
  if (JSON.stringify(fromPath.slice(0, -1)) !== JSON.stringify(toPath.slice(0, -1))) {
    alert("该阶段不能移动到其他父级阶段之下，只能在其所属父级内部调整顺序。");
    return;
  }
  if (fromPath[fromPath.length - 1] === toPath[toPath.length - 1]) return;
  const stages = clonePaperStages(p);
  const parent = findStageNode(stages, fromPath.slice(0, -1));
  let toIdx = toPath[toPath.length - 1];
  const [node] = parent.children.splice(fromPath[fromPath.length - 1], 1);
  if (fromPath[fromPath.length - 1] < toIdx) toIdx--;
  parent.children.splice(insertBefore ? toIdx : toIdx + 1, 0, node);
  persistPaperStages(p, stages);
  refreshAfterStageEdit();
}

// ================================================================
// 【V1.4 双击行内编辑】目标期刊 / NEXT ACTION / 文件夹路径
// 双击进入编辑，点击页面空白处或按 Enter 保存，Esc 取消。
// 所有修改保存在 localStorage，刷新后仍然保留。
// ================================================================
const FIELD_STORE_KEY = "research-hub-fields-v1";

function getFieldStore() {
  try { return JSON.parse(localStorage.getItem(FIELD_STORE_KEY) || "{}"); } catch (e) { return {}; }
}

function getPaperField(p, field) {
  const store = getFieldStore();
  if (store[pkey(p)] && store[pkey(p)][field] != null) return store[pkey(p)][field];
  return p[field];
}

function setPaperField(p, field, value) {
  const store = getFieldStore();
  store[pkey(p)] = store[pkey(p)] || {};
  store[pkey(p)][field] = value;
  try { localStorage.setItem(FIELD_STORE_KEY, JSON.stringify(store)); } catch (e) {}
  p[field] = value;
  touchPaper(p);
}

// 最近更新：任一元素变动时刷新为当前时间（精确到分钟），并持久化。
function nowMinute() {
  const d = new Date();
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function getPaperUpdated(p) {
  const store = getFieldStore();
  if (store[pkey(p)] && store[pkey(p)].lastUpdated) return store[pkey(p)].lastUpdated;
  return p.lastUpdated || "—";
}

function touchPaper(p) {
  p.lastUpdated = nowMinute();
  const store = getFieldStore();
  store[pkey(p)] = store[pkey(p)] || {};
  store[pkey(p)].lastUpdated = p.lastUpdated;
  try { localStorage.setItem(FIELD_STORE_KEY, JSON.stringify(store)); } catch (e) {}
}

function editableText(p, field, cls = "") {
  let val = getPaperField(p, field);
  if (Array.isArray(val)) val = val.length ? val.join("，") : "";
  return `<span class="editable ${cls}" data-edit-id="${p._key}" data-edit-field="${field}" title="双击编辑，点击空白处保存">${val ? escapeHtml(String(val)) : "<span class='muted'>（双击填写）</span>"}</span>`;
}

function startEditField(span) {
  if (!span || span.querySelector("input")) return;
  const p = findPaperByKey(span.dataset.editId);
  if (!p) return;
  const field = span.dataset.editField;
  const input = document.createElement("input");
  input.type = "text";
  input.className = "edit-input";
  if (span.dataset.editHist !== undefined) {
    const hist = getPaperField(p, "history") || [];
    input.value = (hist[+span.dataset.editHist] || {})[field] || "";
  } else if (field === "volumeIssue") {
    const vol = getPaperField(p, "volume") || "";
    const iss = getPaperField(p, "issue") || "";
    input.value = iss ? `${vol}(${iss})` : vol;
  } else {
    const cur = getPaperField(p, field);
    input.value = Array.isArray(cur) ? cur.join("，") : (cur || "");
  }
  span.textContent = "";
  span.appendChild(input);
  input.focus();
  input.select();
  input.addEventListener("blur", () => commitEditField(span, input, p, field));
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") input.blur();
    if (e.key === "Escape") { input.dataset.cancel = "1"; input.blur(); }
  });
}

document.addEventListener("dblclick", e => {
  if (e.target.closest && e.target.closest(".edit-input")) return;
  const span = e.target.closest ? e.target.closest(".editable") : null;
  if (span) startEditField(span);
});

function commitEditField(span, input, p, field) {
  if (input.dataset.cancel !== "1") {
    const val = input.value.trim();
    if (val || field === "authors") {
      let v = val;
      if (field === "authors") v = val.split(/[,，、]/).map(s => s.trim()).filter(Boolean);
      if (field === "submissionCount") v = Number(val) || 0;
      if (field === "citations") {
        v = Number(val) || 0;
        const cdoi = normalizeDoi(getPaperField(p, "doi") || "");
        if (cdoi && !cdoi.includes("xxxx")) {
          const c = getCitationCache();
          delete c[cdoi];
          try { localStorage.setItem(CROSSREF_CACHE_KEY, JSON.stringify(c)); } catch (e) {}
        }
      }
      if (field === "volumeIssue") {
        const m = val.match(/^\s*([^(]*?)\s*(?:\(([^()]*)\)\s*)?$/);
        setPaperField(p, "volume", ((m && m[1]) || "").trim());
        setPaperField(p, "issue", ((m && m[2]) || "").trim());
        render();
        updateStatusBar();
        return;
      }
      if (span.dataset.editHist !== undefined) {
        const hist = JSON.parse(JSON.stringify(getPaperField(p, "history") || []));
        if (hist[+span.dataset.editHist]) { hist[+span.dataset.editHist][field] = v; setPaperField(p, "history", hist); }
      } else {
        setPaperField(p, field, v);
      }
    }
  }
  render();
  updateStatusBar();
}

// ================================================================
// 【V1.6 卡片增删 / 拖拽排序 / 自动重编号】
// 1. 每个页面工具栏有“新增”按钮，卡片右上角 ✕ 删除（带确认）；
// 2. 卡片可直接拖动排序（按钮/输入框/阶段行区域内不会触发卡片拖拽）；
// 3. 增删或拖动后，该页所有卡片按当前顺序重新编号（R001…/S001…/P001…）；
// 4. 每张卡片有稳定内部键 _key，重编号不影响已保存的阶段/编辑数据。
// ================================================================
const CARD_STORE_KEY = "research-hub-cards-v1";
const CARD_PREFIX = { research: "R", submitted: "S", published: "P" };
const SUBMITTED_STATUS_OPTIONS = [["submitted","已投稿"],["with_editor","初审中"],["under_review","外审中"],["minor_revision","小修改"],["major_revision","大修改"],["accepted","已录用"],["rejected","已拒稿"]];

function getCardStore() {
  try { return JSON.parse(localStorage.getItem(CARD_STORE_KEY) || "{}"); } catch (e) { return {}; }
}

function saveCardStore(store) {
  try { localStorage.setItem(CARD_STORE_KEY, JSON.stringify(store)); } catch (e) {}
}

const ORIGINAL_ID = new WeakMap(); // 记录内建论文的原始编号，重编号后仍能正确识别删除项
function getOriginalId(p) {
  if (!ORIGINAL_ID.has(p)) ORIGINAL_ID.set(p, p.id);
  return ORIGINAL_ID.get(p);
}

function getEffectiveList(kind) {
  const st = getCardStore()[kind] || {};
  const removed = st.removed || [];
  const base = (DATA_EMBEDDED[kind] || []).filter(p => !removed.includes(getOriginalId(p)));
  base.forEach(p => { p._key = getOriginalId(p); }); // 内建论文：原始编号即稳定键
  let list = base.concat(Object.values(st.added || {}));
  if (Array.isArray(st.order)) {
    const rank = k => st.order.indexOf(k);
    list = [...list].sort((a, b) => {
      const ra = rank(a._key), rb = rank(b._key);
      if (ra === -1 && rb === -1) return 0;
      if (ra === -1) return 1;
      if (rb === -1) return -1;
      return ra - rb;
    });
  }
  return list;
}

function syncLists() {
  for (const kind of Object.keys(CARD_PREFIX)) {
    const list = getEffectiveList(kind);
    list.forEach((p, i) => { p.id = CARD_PREFIX[kind] + String(i + 1).padStart(3, "0"); });
    DATA[kind] = list;
  }
  updateStatusBar();
}

const NEW_CARD_TEMPLATES = {
  research: () => ({ title: "", authors: [], researchArea: "未分类", status: "writing", progress: 0, priority: "Medium", lastUpdated: nowMinute(), targetJournal: "", filePath: "", nextAction: "", notes: "", keywords: [] }),
  submitted: () => ({ title: "", authors: [], currentJournal: "", status: "submitted", submissionDate: "", lastUpdate: nowMinute(), manuscriptId: "", submissionCount: 1, targetLevel: "SSCI / SCIE", filePath: "", editor: "—", nextAction: "", notes: "", history: [] }),
  published: () => ({ title: "", authors: [], abstract: "", journal: "", language: "en", year: new Date().getFullYear(), volume: "", issue: "", pages: "", doi: "", citations: 0, citationSource: "手工录入", filePath: "", keywords: [] })
};

let lastAddTs = 0;
function addPaperCard(kind) {
  const nowTs = Date.now();
  if (nowTs - lastAddTs < 600) return; // 防止双击/连点在极短时间内生成多张
  lastAddTs = nowTs;
  const st = getCardStore();
  st[kind] = st[kind] || {};
  const key = "A" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const obj = NEW_CARD_TEMPLATES[kind]();
  obj._key = key;
  st[kind].added = st[kind].added || {};
  st[kind].added[key] = obj;
  st[kind].order = getEffectiveList(kind).map(p => p._key).concat(key); // 固定追加到当前列表末尾
  saveCardStore(st);
  syncLists();
  render();
  updateStatusBar();
}

function deletePaperCard(kind, key) {
  const p = findPaperByKey(key);
  const title = p && getPaperField(p, "title");
  if (!confirm(`确定删除卡片${title ? `“${title}”` : ""}吗？该操作会同时清除其阶段与编辑记录。`)) return;
  const st = getCardStore();
  st[kind] = st[kind] || {};
  if (st[kind].added && st[kind].added[key]) {
    delete st[kind].added[key];
  } else {
    st[kind].removed = st[kind].removed || [];
    st[kind].removed.push(key); // 内建论文的 _key 等于原始编号
  }
  if (st[kind].order) st[kind].order = st[kind].order.filter(k => k !== key);
  // 清理该卡片留下的阶段与字段缓存
  const stageStore = getStageStore();
  delete stageStore[key];
  try { localStorage.setItem(STAGE_STORE_KEY, JSON.stringify(stageStore)); } catch (e) {}
  const fieldStore = getFieldStore();
  delete fieldStore[key];
  try { localStorage.setItem(FIELD_STORE_KEY, JSON.stringify(fieldStore)); } catch (e) {}
  saveCardStore(st);
  syncLists();
  render();
  updateStatusBar();
}

// ---------- 卡片拖拽 ----------
let cardDrag = null; // { kind, key }

function cardDragStart(ev, kind, key) {
  const nested = ev.target.closest && ev.target.closest('[draggable="true"]');
  if (nested && nested !== ev.currentTarget) return; // 阶段行等内部拖拽自行处理
  if (ev.target.closest && ev.target.closest("button, select, input, .editable, a")) { ev.preventDefault(); return; }
  cardDrag = { kind, key };
  ev.dataTransfer.effectAllowed = "move";
  try { ev.dataTransfer.setData("text/plain", ""); } catch (e) {}
  ev.currentTarget.classList.add("dragging");
}

function cardDragOver(ev, kind) {
  if (!cardDrag || cardDrag.kind !== kind) return;
  ev.preventDefault();
  const card = ev.currentTarget;
  const rect = card.getBoundingClientRect();
  const before = ev.clientY < rect.top + rect.height / 2;
  card.classList.toggle("drag-over-top", before);
  card.classList.toggle("drag-over-bottom", !before);
}

function cardDragLeave(ev) {
  ev.currentTarget.classList.remove("drag-over-top", "drag-over-bottom");
}

function cardDrop(ev, kind, key) {
  ev.preventDefault();
  ev.currentTarget.classList.remove("drag-over-top", "drag-over-bottom");
  if (!cardDrag || cardDrag.kind !== kind) return;
  const rect = ev.currentTarget.getBoundingClientRect();
  const before = ev.clientY < rect.top + rect.height / 2;
  reorderPaperCard(kind, cardDrag.key, key, before);
  cardDrag = null;
}

function cardDragEnd() {
  cardDrag = null;
  document.querySelectorAll(".paper-card.dragging, .paper-card.drag-over-top, .paper-card.drag-over-bottom")
    .forEach(el => el.classList.remove("dragging", "drag-over-top", "drag-over-bottom"));
}

function reorderPaperCard(kind, fromKey, toKey, insertBefore) {
  const list = DATA[kind] || [];
  const from = list.findIndex(p => p._key === fromKey);
  let to = list.findIndex(p => p._key === toKey);
  if (from < 0 || to < 0 || from === to) return;
  const [node] = list.splice(from, 1);
  if (from < to) to--;
  list.splice(insertBefore ? to : to + 1, 0, node);
  const st = getCardStore();
  st[kind] = st[kind] || {};
  st[kind].order = list.map(p => p._key);
  saveCardStore(st);
  syncLists(); // 重新编号
  render();
  updateStatusBar();
}

// ---------- 在研论文：关键词编辑器 ----------
function renderKeywordEditor(p) {
  const kws = getPaperField(p, "keywords") || [];
  return `<div class="kw-editor"><span class="muted">关键词</span><span class="kw-list">${kws.map((k, i) => `<span class="tag kw-tag">${escapeHtml(k)}<button class="kw-del" title="删除该关键词" onclick="removeKeyword('${p._key}', ${i})">✕</button></span>`).join("")}</span><button class="kw-add" title="添加关键词" onclick="addKeyword('${p._key}')">＋</button></div>`;
}

function addKeyword(key) {
  const p = findPaperByKey(key);
  if (!p) return;
  const name = prompt("请输入关键词：");
  if (!name || !name.trim()) return;
  const kws = (getPaperField(p, "keywords") || []).concat(name.trim());
  setPaperField(p, "keywords", kws);
  render();
  updateStatusBar();
}

function removeKeyword(key, index) {

  kws.splice(index, 1);

// ---------- 在投论文：投稿历史编辑 ----------
function editableHist(p, index, field) {

}

function setHistoryStatus(key, index, value) {

// ---------- V1.7 优先级下拉 ----------
function prioritySelect(p) {
  const cur = getPaperField(p, "priority") || "Medium";

  const list = opts.includes(cur) ? opts : opts.concat([cur]);
  return `<select class="select priority-select pri-${cur}" title="设置优先级" onchange="setPriority('${p._key}', this.value)">${list.map(o => `<option value="${o}" ${o === cur ? "selected" : ""}>${o}</option>`).join("")}</select>`;

function setPriority(key, value) {

  render();
  updateStatusBar();
}

// ---------- V1.7 流转：在研 → 在投（仅继承标题、作者、文件夹路径） ----------
function moveToSubmitted(key) {
  const p = findPaperByKey(key);
  if (!p) return;
  const title = getPaperField(p, "title") || "未命名论文";
  if (!confirm(`确定将“${title}”从在研论文转移到在投论文吗？\n只继承标题、作者与文件夹路径，其余信息需在在投页面手动补充。`)) return;
  const st = getCardStore();
  st.research = st.research || {};
  if (st.research.added && st.research.added[key]) delete st.research.added[key];
  else { st.research.removed = st.research.removed || []; st.research.removed.push(key); }
  if (st.research.order) st.research.order = st.research.order.filter(k => k !== key);
  const fs = getFieldStore();
  const kept = fs[key] || {};
  const stageStore = getStageStore();
  delete stageStore[key];
  try { localStorage.setItem(STAGE_STORE_KEY, JSON.stringify(stageStore)); } catch (e) {}
  delete fs[key];
  const nk = "A" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const np = NEW_CARD_TEMPLATES.submitted();
  np._key = nk;
  np.title = kept.title != null ? kept.title : (p.title || "");
  np.authors = kept.authors != null ? kept.authors : (p.authors || []);
  np.filePath = kept.filePath != null ? kept.filePath : (p.filePath || "");
  fs[nk] = { title: np.title, authors: np.authors, filePath: np.filePath };
  try { localStorage.setItem(FIELD_STORE_KEY, JSON.stringify(fs)); } catch (e) {}
  st.submitted = st.submitted || {};
  st.submitted.added = st.submitted.added || {};
  st.submitted.added[nk] = np;
  st.submitted.order = getEffectiveList("submitted").map(x => x._key).concat(nk);
  saveCardStore(st);
  syncLists();
  render();
  updateStatusBar();
  alert(`“${np.title || "该论文"}”已转移到在投论文列表末尾。`);
}

// ---------- V1.7 投稿历史增删 ----------
function addHistory(key) {

}

function deleteHistory(key, index) {

// ================================================================
// 【V1.8 作者/关键词胶囊编辑器】在研、在投、已发表卡片通用
// 浅绿色圆角胶囊：＋ 添加、悬停右上角 ✕ 删除、左右拖动排序
// ================================================================
function renderChipEditor(p, field, label) {
  const items = getPaperField(p, field) || [];
  return `<div class="chip-editor"><span class="chip-label">${label}</span><span class="chip-list">${items.map((a, i) => `<span class="tag chip" draggable="true" ondragstart="chipDragStart(event,'${p._key}','${field}',${i})" ondragover="chipDragOver(event,'${p._key}','${field}')" ondragleave="chipDragLeave(event)" ondrop="chipDrop(event,'${p._key}','${field}',${i})" ondragend="chipDragEnd(event)">${escapeHtml(a)}<button class="chip-del" title="删除该${label}" onclick="removeChip('${p._key}','${field}',${i})">✕</button></span>`).join("")}</span><button class="kw-add" title="添加${label}" onclick="addChip('${p._key}','${field}','${label}')">＋</button></div>`;
}

function addChip(key, field, label) {
  const p = findPaperByKey(key);
  if (!p) return;
  const name = prompt(`请输入${label}：`);
  if (!name || !name.trim()) return;
  const items = (getPaperField(p, field) || []).concat(name.trim());
  setPaperField(p, field, items);
  render();
  updateStatusBar();
}

function removeChip(key, field, index) {
  const p = findPaperByKey(key);
  if (!p) return;
  const items = (getPaperField(p, field) || []).slice();
  items.splice(index, 1);
  setPaperField(p, field, items);
  render();
  updateStatusBar();
}

let chipDrag = null; // { key, field, index }

function chipDragStart(ev, key, field, index) {
  chipDrag = { key, field, index };
  ev.stopPropagation();
  ev.dataTransfer.effectAllowed = "move";
  try { ev.dataTransfer.setData("text/plain", ""); } catch (e) {}
  ev.currentTarget.classList.add("dragging");
}

function chipDragOver(ev, key, field) {
  if (!chipDrag || chipDrag.key !== key || chipDrag.field !== field) return;
  ev.preventDefault();
  ev.stopPropagation();
  const rect = ev.currentTarget.getBoundingClientRect();
  const left = ev.clientX < rect.left + rect.width / 2;
  ev.currentTarget.classList.toggle("drag-over-left", left);
  ev.currentTarget.classList.toggle("drag-over-right", !left);
}

function chipDragLeave(ev) {
  ev.currentTarget.classList.remove("drag-over-left", "drag-over-right");
}

function chipDrop(ev, key, field, index) {
  ev.preventDefault();
  ev.stopPropagation();
  ev.currentTarget.classList.remove("drag-over-left", "drag-over-right");
  if (!chipDrag || chipDrag.key !== key || chipDrag.field !== field) return;
  const rect = ev.currentTarget.getBoundingClientRect();
  const left = ev.clientX < rect.left + rect.width / 2;
  reorderChip(key, field, chipDrag.index, index, left);
  chipDrag = null;
}

function chipDragEnd() {
  chipDrag = null;
  document.querySelectorAll(".chip.dragging, .chip.drag-over-left, .chip.drag-over-right")
    .forEach(el => el.classList.remove("dragging", "drag-over-left", "drag-over-right"));
}

function reorderChip(key, field, from, to, insertBefore) {
  const p = findPaperByKey(key);
  if (!p || from === to) return;
  const items = (getPaperField(p, field) || []).slice();
  const [node] = items.splice(from, 1);
  let t = to;
  if (from < t) t--;
  items.splice(insertBefore ? t : t + 1, 0, node);
  setPaperField(p, field, items);
  render();
  updateStatusBar();
}

// ---------- V1.8 流转：在投 → 已发表（继承标题、作者、当前期刊→期刊、文件夹路径） ----------
function moveToPublished(key) {
  const p = findPaperByKey(key);
  if (!p) return;
  const title = getPaperField(p, "title") || "未命名论文";
  if (!confirm(`确定将“${title}”从在投论文转移到已发表论文吗？\n将继承标题、作者、当前期刊（转为期刊名）与文件夹路径，其余信息需在已发表页面手动补充。`)) return;
  const st = getCardStore();
  st.submitted = st.submitted || {};
  if (st.submitted.added && st.submitted.added[key]) delete st.submitted.added[key];
  else { st.submitted.removed = st.submitted.removed || []; st.submitted.removed.push(key); }
  if (st.submitted.order) st.submitted.order = st.submitted.order.filter(k => k !== key);
  const fs = getFieldStore();
  const kept = fs[key] || {};
  const stageStore = getStageStore();
  delete stageStore[key];
  try { localStorage.setItem(STAGE_STORE_KEY, JSON.stringify(stageStore)); } catch (e) {}
  delete fs[key];
  const nk = "A" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const np = NEW_CARD_TEMPLATES.published();
  np._key = nk;
  np.title = kept.title != null ? kept.title : (p.title || "");
  np.authors = kept.authors != null ? [...kept.authors] : (p.authors || []);
  np.journal = kept.currentJournal != null ? kept.currentJournal : (p.currentJournal || "");
  np.filePath = kept.filePath != null ? kept.filePath : (p.filePath || "");
  fs[nk] = { title: np.title, authors: np.authors, journal: np.journal, filePath: np.filePath };
  try { localStorage.setItem(FIELD_STORE_KEY, JSON.stringify(fs)); } catch (e) {}
  st.published = st.published || {};
  st.published.added = st.published.added || {};
  st.published.added[nk] = np;
  st.published.order = getEffectiveList("published").map(x => x._key).concat(nk);
  saveCardStore(st);
  syncLists();
  render();
  updateStatusBar();
  alert(`“${np.title || "该论文"}”已转移到已发表论文列表末尾。`);
}

// ---------- V1.9 卷(期) 整体编辑：输入如“39(4)”或“39”，留空表示无卷期 ----------
function volumeIssueEditable(p) {
  const vol = getPaperField(p, "volume") || "";
  const iss = getPaperField(p, "issue") || "";
  const combined = iss ? `${vol}(${iss})` : vol;
  return `<span class="editable" data-edit-id="${p._key}" data-edit-field="volumeIssue" title="双击编辑，如 39(4)；无期则只填卷或不填">${combined ? escapeHtml(combined) : "<span class='muted'>（双击填写）</span>"}</span>`;
}

function downloadHtml(filename, html) {
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return filename;
}

function exportPublications() {
  const list = DATA.published || [];

async function copyAllPublishedReferences(){const zh=sortPublishedReferences((DATA.published||[]).filter(p=>!isEnglishPaper(p)),referenceSortZh),en=sortPublishedReferences((DATA.published||[]).filter(p=>isEnglishPaper(p)),referenceSortEn);const z=zh.map((p,i)=>`[${i+1}] ${buildGb7714Reference(p)}`).join("\n"),e=en.map((p,i)=>`[${i+1}] ${buildGb7714Reference(p)}`).join("\n");const parts=[];if(z)parts.push("中文发表\n"+z);if(e)parts.push("英文发表\n"+e);const text=parts.join("\n\n");if(!text){alert("目前没有可复制的已发表论文。");return}await copyText(text);const st=document.getElementById("copyReferenceStatus");if(st){st.textContent="✓ 已复制当前排序下的全部引用";setTimeout(()=>st.textContent="",2500)}}
